  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n\n\n:root {\n  --color-bg: #f3f2f2;\n  --color-surface: #eae9e9;\n  --color-text: #201e1d;\n  --color-accent: #ec3013;\n  --color-accent-2: #e15b47;\n  --color-divider: color-mix(in srgb, #201e1d 40%, transparent);\n\n  /* Tonal ramps — generated in OKLCH on one shared lightness scale, so the\n     same step of any role matches the others in visual value. */\n  --color-neutral-100: #f8f4f4;\n  --color-neutral-200: #eae7e7;\n  --color-neutral-300: #d7d3d3;\n  --color-neutral-400: #bab6b6;\n  --color-neutral-500: #9b9797;\n  --color-neutral-600: #7d7979;\n  --color-neutral-700: #605d5d;\n  --color-neutral-800: #444141;\n  --color-neutral-900: #2d2b2b;\n\n  --color-accent-100: #fff2ef;\n  --color-accent-200: #ffe0d9;\n  --color-accent-300: #ffc4b8;\n  --color-accent-400: #ff9783;\n  --color-accent-500: #ff563c;\n  --color-accent-600: #dd2b0f;\n  --color-accent-700: #ae1800;\n  --color-accent-800: #7c1405;\n  --color-accent-900: #4d170e;\n\n  --color-accent-2-100: #fff2ef;\n  --color-accent-2-200: #ffe0da;\n  --color-accent-2-300: #ffc4b9;\n  --color-accent-2-400: #ff9784;\n  --color-accent-2-500: #ef6853;\n  --color-accent-2-600: #c94b39;\n  --color-accent-2-700: #9e3526;\n  --color-accent-2-800: #71261b;\n  --color-accent-2-900: #471d16;\n\n  --font-heading: \"Archivo\", system-ui, sans-serif;\n  --font-heading-weight: 800;\n  --font-body: \"Archivo\", system-ui, sans-serif;\n\n  --space-1: 4.0px;\n  --space-2: 8.0px;\n  --space-3: 12.0px;\n  --space-4: 16.0px;\n  --space-6: 24.0px;\n  --space-8: 32.0px;\n\n  --radius-sm: 0px;\n  --radius-md: 0px;\n  --radius-lg: 0px;\n\n  /* Elevation — derived from the ground: soft ink-tinted shadows on a\n     light theme, a hairline edge + ambient darkness on a dark one. */\n  --shadow-sm: 0 1px 2px color-mix(in srgb, #2d2b2b 14%, transparent);\n  --shadow-md: 0 3px 10px color-mix(in srgb, #2d2b2b 16%, transparent);\n  --shadow-lg: 0 12px 32px color-mix(in srgb, #2d2b2b 22%, transparent);\n}\n\nbody {\n  background: var(--color-bg);\n  color: var(--color-text);\n  font-family: var(--font-body);\n}\nh1, h2, h3, h4 { font-family: var(--font-heading); font-weight: var(--font-heading-weight); }\n\n.grayscale{filter:grayscale(1) contrast(1.08)}\n\n/* ══════════════════════════════════════════════════════════════════════════\n   Components — built with the tokens above. Plain CSS\n   on plain HTML: no JavaScript, no build step. Each class is documented in\n   readme.md and demonstrated in foundations/ and components/.\n   ══════════════════════════════════════════════════════════════════════ */\n\n*, *::before, *::after { box-sizing: border-box; }\nbody { margin: 0; font-size: 15px; line-height: 1.55; font-weight: 400; }\nh1, h2, h3, h4, h5, h6 {\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  line-height: 1.12; letter-spacing: -0.015em; margin: 0 0 var(--space-2);\n}\nh1 { font-size: 42px; }\nh2 { font-size: 32px; }\nh3 { font-size: 25px; }\nh4 { font-size: 20px; }\nh5 { font-size: 16px; }\nh6 { font-size: 13px; }\nh6 { letter-spacing: 0.08em; text-transform: uppercase; }\np { margin: 0 0 var(--space-3); }\na { color: var(--color-accent); text-underline-offset: 3px; }\nimg { display: block; max-width: 100%; }\nfigure { margin: 0; }\nfigcaption {\n  font-size: 11px; margin-top: var(--space-1);\n  color: color-mix(in srgb, var(--color-text) 55%, transparent);\n}\n.text-muted { color: color-mix(in srgb, var(--color-text) 55%, transparent); }\n:focus { outline: none; }\n:focus-visible { outline: 2px solid var(--color-accent); outline-offset: 2px; }\n::selection { background: color-mix(in srgb, var(--color-accent) 30%, transparent); }\n\n/* — rules — */\n.hr {\n  height: 2px; border: 0; margin: var(--space-4) 0;\n  background: var(--color-divider);\n}\n\n/* — buttons — */\n.btn {\n  display: inline-flex; align-items: center; justify-content: center; gap: 6px;\n  cursor: pointer; text-decoration: none;\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  font-size: 14px; line-height: 1.2; color: var(--color-text); /* matches the .input's 14px —\n     the pair sits side by side in sign-up rows */\n  background: transparent; border: 1px solid transparent;\n  padding: var(--space-2) calc(var(--space-3) * 1.2);\n  border-radius: var(--radius-md);\n}\n.btn svg { display: block; }\n.btn:disabled { opacity: 0.45; cursor: not-allowed; }\n.btn-primary { background: var(--color-accent); color: var(--color-bg); }\n.btn-primary:hover { background: var(--color-accent-600); }\n.btn-primary:active { background: var(--color-accent-700); }\n.btn-secondary { border-color: var(--color-divider); }\n.btn-secondary:hover { background: color-mix(in srgb, var(--color-text) 7%, transparent); }\n.btn-secondary:active { background: color-mix(in srgb, var(--color-text) 14%, transparent); }\n.btn-ghost { color: var(--color-accent); padding-inline: var(--space-1); }\n.btn-ghost:hover { background: color-mix(in srgb, var(--color-accent) 10%, transparent); }\n.btn-ghost:active { background: color-mix(in srgb, var(--color-accent) 18%, transparent); }\n.btn-icon { width: 36px; height: 36px; padding: 0; }\n.btn-block { width: 100%; margin-top: var(--space-2); justify-content: flex-start; text-align: left; }\n\n/* — forms — */\n.field > label {\n  display: block; font-size: 12px; margin-bottom: 5px;\n  color: color-mix(in srgb, var(--color-text) 70%, transparent);\n}\n.input {\n  width: 100%; min-height: 36px; padding: 6px 10px; font: inherit;\n  font-size: 14px; color: var(--color-text); caret-color: var(--color-accent);\n  background: var(--color-surface);\n  border: 1px solid var(--color-divider); border-radius: var(--radius-md);\n}\n.input:hover { border-color: color-mix(in srgb, var(--color-text) 45%, transparent); }\n.input:focus-visible { border-color: var(--color-accent); outline-offset: 0; }\ntextarea.input { min-height: 90px; resize: vertical; }\n.radio { display: inline-flex; align-items: center; gap: 8px; cursor: pointer; font-size: 14px; }\n.radio input, .seg-opt input {\n  position: absolute; opacity: 0; width: 0; height: 0; pointer-events: none;\n}\n.radio .dot {\n  width: 16px; height: 16px; flex: none; border-radius: 50%;\n  border: 1.5px solid var(--color-divider);\n}\n.radio:hover .dot { border-color: var(--color-accent); }\n.radio input:checked + .dot {\n  border-color: var(--color-accent); background: var(--color-accent);\n  box-shadow: inset 0 0 0 4px var(--color-bg);\n}\n.radio input:focus-visible + .dot { outline: 2px solid var(--color-accent); outline-offset: 2px; }\n.seg {\n  display: inline-flex; overflow: hidden;\n  border: 1px solid var(--color-divider); border-radius: var(--radius-md);\n}\n.seg-opt {\n  display: inline-flex; align-items: center; gap: 6px;\n  padding: 7px 12px; font-size: 13px; cursor: pointer;\n}\n.seg-opt + .seg-opt { border-left: 1px solid var(--color-divider); }\n.seg-opt:has(input:checked) { background: var(--color-accent); color: var(--color-bg); }\n.seg-opt:not(:has(input:checked)):hover { background: color-mix(in srgb, var(--color-text) 7%, transparent); }\n.seg-opt:has(input:focus-visible) { outline: 2px solid var(--color-accent); outline-offset: -2px; }\n\n/* — cards — */\n.card {\n  display: flex; flex-direction: column; gap: var(--space-2);\n  padding: var(--space-3); border-radius: var(--radius-md); background: var(--color-surface);\n}\n.card-kicker { font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--color-accent); }\n.card-title {\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  font-size: 17px; line-height: 1.2;\n}\n.card-body { margin: 0; font-size: 13px; opacity: 0.8; flex: 1; }\n.card-meta {\n  display: flex; align-items: center; gap: 6px; font-size: 11px;\n  color: color-mix(in srgb, var(--color-text) 50%, transparent);\n}\n.elev-sm { box-shadow: var(--shadow-sm); }\n.elev-md { box-shadow: var(--shadow-md); }\n.elev-lg { box-shadow: var(--shadow-lg); }\n\n/* — tags — */\n.tag {\n  display: inline-flex; align-items: center; font-size: 11px;\n  letter-spacing: 0.02em; padding: 3px 10px;\n  border-radius: calc(var(--radius-md) * 0.75);\n}\n.tag-accent { background: var(--color-accent-100); color: var(--color-accent-800); }\n.tag-accent-2 { background: var(--color-accent-2-100); color: var(--color-accent-2-800); }\n.tag-neutral { background: var(--color-neutral-100); color: var(--color-neutral-800); }\n.tag-outline { border: 1px solid var(--color-accent); color: var(--color-accent); }\n\n/* — navigation — */\n.nav {\n  display: flex; align-items: center; gap: var(--space-4);\n  padding: var(--space-3) var(--space-4);\n  border-bottom: 2px solid var(--color-divider);\n}\n.nav-brand {\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  font-size: 18px; margin-right: auto;\n}\n.nav a { color: inherit; text-decoration: none; font-size: 14px; }\n.nav a:hover, .nav a[aria-current='page'] { color: var(--color-accent); }\n\n/* — tables — */\n.table { width: 100%; border-collapse: collapse; font-size: 14px; }\n.table th {\n  text-align: left; font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase;\n  color: color-mix(in srgb, var(--color-text) 60%, transparent);\n  padding: var(--space-2); border-bottom: 2px solid var(--color-divider);\n}\n.table td {\n  padding: var(--space-2);\n  border-bottom: 1px solid var(--color-divider);\n}\n.table tbody tr:hover { background: color-mix(in srgb, var(--color-text) 4%, transparent); }\n\n/* — dialog — */\n.dialog-backdrop {\n  position: fixed; inset: 0; display: grid; place-items: center;\n  padding: var(--space-4);\n  background: color-mix(in srgb, var(--color-neutral-900) 50%, transparent);\n}\n.dialog {\n  width: min(440px, 100%); display: flex; flex-direction: column; gap: var(--space-3);\n  padding: var(--space-4); border-radius: var(--radius-lg);\n  background: var(--color-surface); box-shadow: var(--shadow-lg);\n}\n.dialog-title {\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  font-size: 20px;\n}\n.dialog-body { font-size: 14px; opacity: 0.85; }\n.dialog-actions { display: flex; justify-content: flex-end; gap: var(--space-2); margin-top: var(--space-2); }\n\n<\u002Fstyle>\n<script src=\"4654d14a-9ee3-4df8-a331-923841a7d559\"><\u002Fscript>\n<style>/* vietnamese */\n@font-face {\n  font-family: 'Familjen Grotesk';\n  font-style: normal;\n  font-weight: 400;\n  font-display: swap;\n  src: url(\"32bae37d-4187-4073-b55a-463330f8b465\") format('woff2');\n  unicode-range: U+0102-0103, U+0110-0111, U+0128-0129, U+0168-0169, U+01A0-01A1, U+01AF-01B0, U+0300-0301, U+0303-0304, U+0308-0309, U+0323, U+0329, U+1EA0-1EF9, U+20AB;\n}\n/* latin-ext */\n@font-face {\n  font-family: 'Familjen Grotesk';\n  font-style: normal;\n  font-weight: 400;\n  font-display: swap;\n  src: url(\"3943cd4c-e221-4cef-97c2-8003a1a5efbb\") format('woff2');\n  unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C4, U+2113, U+2C60-2C7F, U+A720-A7FF;\n}\n/* latin */\n@font-face {\n  font-family: 'Familjen Grotesk';\n  font-style: normal;\n  font-weight: 400;\n  font-display: swap;\n  src: url(\"0db6e7df-62f8-42f1-b00b-4cab6e67ade7\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n/* vietnamese */\n@font-face {\n  font-family: 'Familjen Grotesk';\n  font-style: normal;\n  font-weight: 500;\n  font-display: swap;\n  src: url(\"32bae37d-4187-4073-b55a-463330f8b465\") format('woff2');\n  unicode-range: U+0102-0103, U+0110-0111, U+0128-0129, U+0168-0169, U+01A0-01A1, U+01AF-01B0, U+0300-0301, U+0303-0304, U+0308-0309, U+0323, U+0329, U+ dth:1240px;margin:0 auto;padding:48px 32px 96px;display:flex;flex-direction:column\">\n\n<header style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:32px;padding-bottom:32px;border-bottom:2px solid var(--color-text)\">\n  <div style=\"display:flex;flex-direction:column;gap:12px\">\n    <span class=\"tag tag-accent\" style=\"align-self:flex-start;white-space:nowrap\">Release notes · Nov 10, 2026 · final review<\u002Fspan>\n    <h1 style=\"font-family:var(--font-heading);font-weight:800;font-size:clamp(40px,5.5vw,68px);line-height:0.95;letter-spacing:-0.02em;margin:0;text-wrap:balance\">Company ABC: what we built and how it’s designed to pay.<\u002Fh1>\n  <\u002Fdiv>\n  <div style=\"display:flex;flex-direction:column;justify-content:flex-end;gap:12px;font-size:16px;line-height:1.5\">\n    <p style=\"margin:0;text-wrap:pretty\">This summarises the Company ABC research-supply build: the design changes, every gamified mechanic and where it lives, the new admin console, and the levers each one pulls on order size, sharing, return visits and revenue. All impact figures are planning estimates, not measured results. The revenue model lets you adjust the assumptions.<\u002Fp>\n    <div style=\"display:flex;gap:8px;flex-wrap:wrap\">\n      <sc-for list=\"{{ files }}\" as=\"f\" hint-placeholder-count=\"6\"><a href=\"{{ f.href }}\" class=\"tag tag-outline\" style=\"text-decoration:none;white-space:nowrap;height:auto\">{{ f.label }}<\u002Fa><\u002Fsc-for>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fheader>\n\n<section style=\"padding:40px 0;border-bottom:2px solid var(--color-text);display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:0\">\n  <sc-for list=\"{{ headline }}\" as=\"h\" hint-placeholder-count=\"4\">\n    <div style=\"padding:0 24px 0 0;display:flex;flex-direction:column;gap:6px\">\n      <span style=\"font-family:var(--font-heading);font-weight:800;font-size:56px;line-height:1;letter-spacing:-0.02em;color:var(--color-accent)\">{{ h.v }}<\u002Fspan>\n      <strong style=\"font-size:16px\">{{ h.k }}<\u002Fstrong>\n      <span style=\"font-size:14px;line-height:1.45;color:var(--color-neutral-700)\">{{ h.s }}<\u002Fspan>\n    <\u002Fdiv>\n  <\u002Fsc-for>\n<\u002Fsection>\n\n<section style=\"padding:40px 0;border-bottom:2px solid var(--color-text);display:flex;flex-direction:column;gap:24px\">\n  <div style=\"display:flex;gap:16px;align-items:baseline\"><span style=\"font-weight:800;color:var(--color-accent)\">00<\u002Fspan><h2 style=\"font-family:var(--font-heading);font-weight:800;font-size:32px;margin:0\">Where this build is stronger<\u002Fh2><\u002Fdiv>\n  <p style=\"margin:0;max-width:780px;font-size:16px;line-height:1.5;text-wrap:pretty\">In this category buyers are sceptical, pay in crypto and reorder the same few products. The build is designed around those three facts: prove quality first, make repeat orders quick, and measure incentives so you can keep the ones that pay. Trust also makes customers sticky: once a buyer has vetted a supplier, switching means vetting someone new.<\u002Fp>\n  <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));border-top:2px solid var(--color-text);border-left:2px solid var(--color-text)\">\n    <sc-for list=\"{{ advantages }}\" as=\"a\" hint-placeholder-count=\"8\">\n      <div style=\"padding:20px 22px;border-right:2px solid var(--color-text);border-bottom:2px solid var(--color-text);display:flex;flex-direction:column;gap:8px;background:#fff\">\n        <span style=\"font-family:var(--font-heading);font-weight:800;font-size:15px;color:var(--color-accent)\">{{ a.n }}<\u002Fspan>\n        <strong style=\"font-family:var(--font-heading);font-size:20px;line-height:1.2\">{{ a.t }}<\u002Fstrong>\n        <span style=\"font-size:14.5px;line-height:1.5\">{{ a.b }}<\u002Fspan>\n        <span style=\"font-size:13px;line-height:1.45;color:var(--color-neutral-700);margin-top:auto;padding-top:6px;border-top:1px solid var(--color-divider)\">{{ a.p }}<\u002Fspan>\n      <\u002Fdiv>\n    <\u002Fsc-for>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section style=\"padding:40px 0;border-bottom:2px solid var(--color-text);display:flex;flex-direction:column;gap:24px\">\n  <div style=\"display:flex;gap:16px;align-items:baseline\"><span style=\"font-weight:800;color:var(--color-accent)\">01<\u002Fspan><h2 style=\"font-family:var(--font-heading);font-weight:800;font-size:32px;margin:0\">Design changes<\u002Fh2><\u002Fdiv>\n  <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));border-top:2px solid var(--color-divider);border-left:2px solid var(--color-divider)\">\n    <sc-for list=\"{{ design }}\" as=\"d\" hint-placeholder-count=\"9\">\n      <div style=\"padding:20px;border-right:2px solid var(--color-divider);border-bottom:2px solid var(--color-divider);background:#fff;display:flex;flex-direction:column;gap:8px\">\n        <span style=\"font-size:12px;font-weight:700;letter-spacing:0.06em;text-transform:uppercase;color:var(--color-accent-700)\">{{ d.area }}<\u002Fspan>\n        <strong style=\"font-size:17px;line-height:1.3\">{{ d.what }}<\u002Fstrong>\n        <span style=\"font-size:14px;line-height:1.5;color:var(--color-neutral-800)\">{{ d.why }}<\u002Fspan>\n      <\u002Fdiv>\n    <\u002Fsc-for>\n  <\u002Fdiv>\n<\u002Fsection>\n\n\n\n<section style=\"padding:40px 0;border-bottom:2px solid var(--color-text);display:flex;flex-direction:column;gap:24px\">\n  <div style=\"display:flex;gap:16px;align-items:baseline\"><span style=\"font-weight:800;color:var(--color-accent)\">02<\u002Fspan><h2 style=\"font-family:var(--font-heading);font-weight:800;font-size:32px;margin:0\">Less friction: fewer clicks to order<\u002Fh2><\u002Fdiv>\n  <p style=\"margin:0;max-width:780px;font-size:16px;line-height:1.5;text-wrap:pretty\">A typical research-supply store makes a returning researcher repeat a 5-step checkout, re-tick compliance boxes and paste a wallet address by hand on every order. This build keeps the same compliance but asks for each thing once, and remembers how they pay.<\u002Fp>\n  <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));border-top:2px solid var(--color-text)\">\n    <sc-for list=\"{{ clicks }}\" as=\"x\" hint-placeholder-count=\"4\"><div style=\"padding:16px 20px 16px 0;display:flex;flex-direction:column;gap:4px;border-bottom:2px solid var(--color-divider)\"><span style=\"font-size:13px;font-weight:700;color:var(--color-neutral-700)\">{{ x.k }}<\u002Fspan><span style=\"font-family:var(--font-heading);font-weight:800;font-size:30px;line-height:1\"><span style=\"color:var(--color-neutral-700);text-decoration:line-through;font-size:20px\">{{ x.before }}<\u002Fspan> → <span style=\"color:var(--color-accent)\">{{ x.after }}<\u002Fspan><\u002Fspan><span style=\"font-size:13px;color:var(--color-neutral-700)\">{{ x.note }}<\u002Fspan><\u002Fdiv><\u002Fsc-for>\n  <\u002Fdiv>\n  <div style=\"overflow-x:auto;background:#fff;border:2px solid var(--color-text)\">\n    <sc-raw-table class=\"table\" style=\"width:100%;min-width:760px\">\n      <sc-raw-thead><sc-raw-tr><sc-raw-th style=\"text-align:left\">Step<\u002Fsc-raw-th><sc-raw-th style=\"text-align:left\">Before (typical store)<\u002Fsc-raw-th><sc-raw-th style=\"text-align:left\">After (Company ABC)<\u002Fsc-raw-th><\u002Fsc-raw-tr><\u002Fsc-raw-thead>\n      <sc-raw-tbody><sc-for list=\"{{ friction }}\" as=\"r\" hint-placeholder-count=\"10\"><sc-raw-tr><sc-raw-td><strong>{{ r.step }}<\u002Fstrong><\u002Fsc-raw-td><sc-raw-td style=\"font-size:14px;color:var(--color-neutral-800)\">{{ r.before }}<\u002Fsc-raw-td><sc-raw-td style=\"font-size:14px\">{{ r.after }}<\u002Fsc-raw-td><\u002Fsc-raw-tr><\u002Fsc-for><\u002Fsc-raw-tbody>\n    <\u002Fsc-raw-table>\n  <\u002Fdiv>\n  <span style=\"font-size:13px;color:var(--color-neutral-700)\">Before figures are a typical multi-step research-supply checkout; after figures are counted in this prototype for a signed-in researcher reordering a mixed 5-vial pack and paying in USDC.<\u002Fspan>\n<\u002Fsection>\n\n<section style=\"padding:40px 0;border-bottom:2px solid var(--color-text);display:flex;flex-direction:column;gap:20px\">\n  <div style=\"display:flex;gap:16px;align-items:baseline\"><span style=\"font-weight:800;color:var(--color-accent)\">03<\u002Fspan><h2 style=\"font-family:var(--font-heading);font-weight:800;font-size:32px;margin:0\">Crypto checkout: the least-friction path<\u002Fh2><\u002Fdiv>\n  <p style=\"margin:0;max-width:820px;font-size:16px;line-height:1.5;text-wrap:pretty\">Most crypto checkouts lose buyers in three places: picking a network, copying an address, and not holding crypto at all. One competitor we reviewed asks three questions (which app, which coin, which network), then adds a warning box and a checkbox. Our approach removes the questions instead of warning about them.<\u002Fp>\n  <div style=\"display:grid;border-top:2px solid var(--color-text)\">\n    <div style=\"display:grid;grid-template-columns:minmax(140px,1fr) minmax(0,2fr) minmax(0,2fr);gap:16px;padding:10px 0;border-bottom:2px solid var(--color-text)\"><span style=\"font-size:12px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--color-accent-700)\">Friction point<\u002Fspan><span style=\"font-size:12px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--color-accent-700)\">Typical crypto checkout<\u002Fspan><span style=\"font-size:12px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--color-accent-700)\">Company ABC<\u002Fspan><\u002Fdiv>\n    <div style=\"display:grid;grid-template-columns:minmax(140px,1fr) minmax(0,2fr) minmax(0,2fr);gap:16px;padding:12px 0;border-bottom:1px solid var(--color-divider);font-size:14.5px;line-height:1.45\"><strong>Choosing a network<\u002Fstrong><span style=\"color:var(--color-neutral-700)\">Pick app, then coin, then network; a red warning that the wrong network loses money<\u002Fspan><span>One question, “Pay with”, four main options, each on one fixed network: USDC on Base, USDC on Solana, Bitcoin Lightning and USDT on Tron. PYUSD, main-network Bitcoin and USDC on Ethereum sit behind “Other networks”<\u002Fspan><\u002Fdiv>\n    <div style=\"display:grid;grid-template-columns:minmax(140px,1fr) minmax(0,2fr) minmax(0,2fr);gap:16px;padding:12px 0;border-bottom:1px solid var(--color-divider);font-size:14.5px;line-height:1.45\"><strong>Copying an address<\u002Fstrong><span style=\"color:var(--color-neutral-700)\">Copy a long address and amount by hand<\u002Fspan><span>A QR code (on a computer) or an “Open wallet” button (on a phone) with the address, amount and network already encoded, so nothing is typed or chosen. Copy-and-paste stays as a fallback<\u002Fspan><\u002Fdiv>\n    <div style=\"display:grid;grid-template-columns:minmax(140px,1fr) minmax(0,2fr) minmax(0,2fr);gap:16px;padding:12px 0;border-bottom:1px solid var(--color-divider);font-size:14.5px;line-height:1.45\"><strong>Paying again<\u002Fstrong><span style=\"color:var(--color-neutral-700)\">Repeat every step on every order<\u002Fspan><span>The wallet is remembered after the first payment; next time it is one approval<\u002Fspan><\u002Fdiv>\n    <div style=\"display:grid;grid-template-columns:minmax(140px,1fr) minmax(0,2fr) minmax(0,2fr);gap:16px;padding:12px 0;border-bottom:1px solid var(--color-divider);font-size:14.5px;line-height:1.45\"><strong>Not holding crypto<\u002Fstrong><span style=\"color:var(--color-neutral-700)\">Sent away to a separate guide<\u002Fspan><span>“No crypto yet? Buy USDC with a card or Apple Pay” inside the payment window, delivered straight to the order. Apple Pay can’t buy crypto itself; an embedded on-ramp (e.g. Coinbase, MoonPay, Stripe) takes Apple Pay as the payment method. A note says this carries about a 4% fee, which mostly cancels the stablecoin saving<\u002Fspan><\u002Fdiv>\n    <div style=\"display:grid;grid-template-columns:minmax(140px,1fr) minmax(0,2fr) minmax(0,2fr);gap:16px;padding:12px 0;border-bottom:1px solid var(--color-divider);font-size:14.5px;line-height:1.45\"><strong>Price moving<\u002Fstrong><span style=\"color:var(--color-neutral-700)\">Unclear what happens if the price changes<\u002Fspan><span>Amount locked for 15 minutes with a visible timer; underpayments get a top-up link, overpayments become credit<\u002Fspan><\u002Fdiv>\n    <div style=\"display:grid;grid-template-columns:minmax(140px,1fr) minmax(0,2fr) minmax(0,2fr);gap:16px;padding:12px 0;border-bottom:1px solid var(--color-divider);font-size:14.5px;line-height:1.45\"><strong>Knowing it worked<\u002Fstrong><span style=\"color:var(--color-neutral-700)\">Press “I’ve sent it” and wait for an email<\u002Fspan><span>In production, payment is detected automatically and the steps tick through: waiting, detected, confirmed. The demo simulates this<\u002Fspan><\u002Fdiv>\n    <div style=\"display:grid;grid-template-columns:minmax(140px,1fr) minmax(0,2fr) minmax(0,2fr);gap:16px;padding:12px 0;border-bottom:1px solid var(--color-divider);font-size:14.5px;line-height:1.45\"><strong>Incentive<\u002Fstrong><span style=\"color:var(--color-neutral-700)\">Discount revealed late, if at all<\u002Fspan><span>“Save $X” beside each method before choosing; stablecoins get the largest discount<\u002Fspan><\u002Fdiv>\n  <\u002Fdiv>\n  <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));border-top:2px solid var(--color-text)\"><div style=\"padding:16px 20px 16px 0;display:flex;flex-direction:column;gap:6px\"><span style=\"font-size:12px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--color-accent-700)\">Which networks, and why<\u002Fspan><span style=\"font-size:14.5px;line-height:1.5\">No single network is best. Base, Solana and Ethereum swap the top spot for stablecoin volume month to month, but much of that volume is trading rather than payments. For everyday person-to-person payments, USDT on Tron carries the most. So checkout leads with USDC on Base and on Solana (whichever the buyer’s wallet uses), Bitcoin Lightning and USDT on Tron, each on one fixed network.<\u002Fspan><\u002Fdiv><div style=\"padding:16px 20px 16px 0;display:flex;flex-direction:column;gap:6px\"><span style=\"font-size:12px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--color-accent-700)\">Easiest path for US buyers<\u002Fspan><span style=\"font-size:14.5px;line-height:1.5\">Cash App users can scan a Bitcoin Lightning QR code and pay from their dollar balance without owning any bitcoin. That makes Lightning the lowest-friction option for most US shoppers. The in-window card or Apple Pay purchase covers everyone else, at about a 4% fee unless a zero-fee on-ramp deal is in place.<\u002Fspan><\u002Fdiv><div style=\"padding:16px 20px 16px 0;display:flex;flex-direction:column;gap:6px\"><span style=\"font-size:12px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--color-accent-700)\">PayPal and Venmo<\u002Fspan><span style=\"font-size:14.5px;line-height:1.5\">Verified accounts can send PayPal’s PYUSD stablecoin to an outside wallet, but the buyer picks a network and transfers can take a couple of hours. So PYUSD is offered under “Other networks” rather than as a main option.<\u002Fspan><\u002Fdiv><\u002Fdiv>\n<\u002Fsection>\n\n<section style=\"padding:40px 0;border-bottom:2px solid var(--color-text);display:flex;flex-direction:column;gap:20px\">\n  <div style=\"display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;align-items:baseline\"><div style=\"display:flex;gap:16px;align-items:baseline\"><span style=\"font-weight:800;color:var(--color-accent)\">04<\u002Fspan><h2 style=\"font-family:var(--font-heading);font-weight:800;font-size:32px;margin:0\">Every mechanic in the build<\u002Fh2><\u002Fdiv><span style=\"font-size:14px;color:var(--color-neutral-700)\">{{ gameCountLine }}<\u002Fspan><\u002Fdiv>\n  <p style=\"margin:0;max-width:760px;font-size:16px;line-height:1.5;color:var(--color-neutral-700);text-wrap:pretty\">Each mechanic below is a game-style incentive meant to drive sales, such as bigger orders, referrals, repeat visits or trust. Treat them as a menu of ideas, not a set to run all at once. Rotate them through the year with a few live at a time, and switch them on or off from the admin console so each one stays fresh.<\u002Fp>\n  <div style=\"display:flex;gap:0;border:2px solid var(--color-text);align-self:flex-start;flex-wrap:wrap\">\n    <sc-for list=\"{{ leverTabs }}\" as=\"t\" hint-placeholder-count=\"5\"><button sc-camel-on-click=\"{{ t.pick }}\" style=\"padding:10px 14px;border:0;border-right:2px solid var(--color-text);background:{{ t.bg }};color:{{ t.fg }};font-family:inherit;font-size:14px;font-weight:700;cursor:pointer;white-space:nowrap\">{{ t.label }}<\u002Fbutton><\u002Fsc-for>\n  <\u002Fdiv>\n  <div style=\"overflow-x:auto;background:#fff;border:2px solid var(--color-text)\">\n    <sc-raw-table class=\"table\" style=\"width:100%;min-width:960px\">\n      <sc-raw-thead><sc-raw-tr><sc-raw-th style=\"text-align:left\">Mechanic<\u002Fsc-raw-th><sc-raw-th style=\"text-align:left\">Where<\u002Fsc-raw-th><sc-raw-th style=\"text-align:left\">Default<\u002Fsc-raw-th><sc-raw-th style=\"text-align:left\">Order size<\u002Fsc-raw-th><sc-raw-th style=\"text-align:left\">Virality<\u002Fsc-raw-th><sc-raw-th style=\"text-align:left\">Return visits<\u002Fsc-raw-th><sc-raw-th style=\"text-align:left\">Trust<\u002Fsc-raw-th><sc-raw-th style=\"text-align:left\">Est. revenue effect<\u002Fsc-raw-th><\u002Fsc-raw-tr><\u002Fsc-raw-thead>\n      <sc-raw-tbody>\n        <sc-for list=\"{{ gameRows }}\" as=\"g\" hint-placeholder-count=\"12\">\n          <sc-raw-tr sc-camel-on-mouse-enter=\"{{ g.enter }}\" sc-camel-on-mouse-move=\"{{ g.enter }}\" sc-camel-on-mouse-leave=\"{{ g.leave }}\" style=\"background:{{ g.rowBg }}\"><sc-raw-td style=\"cursor:help\"><strong style=\"text-decoration:underline dotted;text-underline-offset:3px\">{{ g.name }}<\u002Fstrong><br><span style=\"font-size:12px;color:var(--color-neutral-700)\">{{ g.desc }}<\u002Fspan>\n            \n          <\u002Fsc-raw-td><sc-raw-td style=\"font-size:13px\">{{ g.where }}<\u002Fsc-raw-td><sc-raw-td><span class=\"tag {{ g.defCls }}\" style=\"white-space:nowrap\">{{ g.def }}<\u002Fspan><\u002Fsc-raw-td><sc-raw-td style=\"font-weight:800;color:var(--color-accent)\">{{ g.aov }}<\u002Fsc-raw-td><sc-raw-td style=\"font-weight:800;color:var(--color-accent)\">{{ g.vir }}<\u002Fsc-raw-td><sc-raw-td style=\"font-weight:800;color:var(--color-accent)\">{{ g.ret }}<\u002Fsc-raw-td><sc-raw-td style=\"font-weight:800;color:var(--color-accent)\">{{ g.tru }}<\u002Fsc-raw-td><sc-raw-td style=\"font-size:13px\">{{ g.rev }}<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n        <\u002Fsc-for>\n      <\u002Fsc-raw-tbody>\n    <\u002Fsc-raw-table>\n  <\u002Fdiv>\n  <sc-if value=\"{{ hasHover }}\" hint-placeholder-val=\"{{ false }}\">\n    <div style=\"position:fixed;left:{{ hv.x }}px;top:{{ hv.y }}px;z-index:50;width:420px;max-width:calc(100vw - 32px);background:var(--color-text);color:var(--color-bg);border:2px solid var(--color-text);box-shadow:var(--shadow-lg);padding:16px;display:flex;flex-direction:column;gap:10px;font-size:13px;line-height:1.5;pointer-events:none;box-sizing:border-box\">\n      <strong style=\"font-size:15px;color:#fff\">{{ hv.name }}<\u002Fstrong>\n      <span><strong style=\"color:var(--color-accent-300)\">How it works · <\u002Fstrong>{{ hv.how }}<\u002Fspan>\n      <span><strong style=\"color:var(--color-accent-300)\">Example · <\u002Fstrong>{{ hv.ex }}<\u002Fspan>\n      <span><strong style=\"color:var(--color-accent-300)\">Why it lifts sales · <\u002Fstrong>{{ hv.why }}<\u002Fspan>\n      <span><strong style=\"color:var(--color-accent-300)\">Guardrail · <\u002Fstrong>{{ hv.guard }}<\u002Fspan>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n  <span style=\"font-size:13px;color:var(--color-neutral-700)\">Ranked by combined impact across the four levers. Hover a mechanic for how it works, an example, why it lifts sales and its guardrail. ●●● strong · ●● moderate · ● light. \"Core\" means always on (no switch). The seasonal promo banner is the \"Seasonal sale\" switch plus a type picker. \"Favorites\" is the default preset; switch to \"Everything\" in the admin console to try the rest.<\u002Fspan>\n<\u002Fsection>\n\n\n<section style=\"padding:40px 0;border-bottom:2px solid var(--color-text);display:flex;flex-direction:column;gap:24px\">\n  <div style=\"display:flex;gap:16px;align-items:baseline\"><span style=\"font-weight:800;color:var(--color-accent)\">05<\u002Fspan><h2 style=\"font-family:var(--font-heading);font-weight:800;font-size:32px;margin:0\">How the levers drive revenue<\u002Fh2><\u002Fdiv>\n  <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));border-top:2px solid var(--color-text)\">\n    <sc-for list=\"{{ levers }}\" as=\"l\" hint-placeholder-count=\"4\">\n      <div style=\"padding:20px 24px 20px 0;display:flex;flex-direction:column;gap:10px;border-bottom:2px solid var(--color-divider)\">\n        <span style=\"font-family:var(--font-heading);font-weight:800;font-size:22px\">{{ l.name }}<\u002Fspan>\n        <span style=\"font-size:14px;line-height:1.5\">{{ l.how }}<\u002Fspan>\n        <span style=\"font-size:13px;line-height:1.5;color:var(--color-neutral-800)\"><strong>Mechanics: <\u002Fstrong>{{ l.games }}<\u002Fspan>\n        <span style=\"font-size:13px;line-height:1.5;color:var(--color-neutral-800)\"><strong>Measure: <\u002Fstrong>{{ l.kpi }}<\u002Fspan>\n        <span style=\"font-size:13px;line-height:1.5;color:var(--color-accent-700)\"><strong>Planning range: <\u002Fstrong>{{ l.range }}<\u002Fspan>\n      <\u002Fdiv>\n    <\u002Fsc-for>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section style=\"padding:40px 0;border-bottom:2px solid var(--color-text);display:flex;flex-direction:column;gap:24px\">\n  <div style=\"display:flex;gap:16px;align-items:baseline\"><span style=\"font-weight:800;color:var(--color-accent)\">06<\u002Fspan><h2 style=\"font-family:var(--font-heading);font-weight:800;font-size:32px;margin:0\">Revenue model<\u002Fh2><\u002Fdiv>\n  <p style=\"margin:0;max-width:780px;font-size:16px;line-height:1.5\">Plug in your real numbers. The model compounds four effects: bigger orders, more orders per customer, new customers from referrals, and the cost of discounts. It's a sizing tool, not a forecast.<\u002Fp>\n  <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));border:2px solid var(--color-text);background:#fff\">\n    <div style=\"padding:24px;display:flex;flex-direction:column;gap:14px;border-right:2px solid var(--color-divider)\">\n      <sc-for list=\"{{ sliders }}\" as=\"s\" hint-placeholder-count=\"8\">\n        <label style=\"display:flex;flex-direction:column;gap:6px;font-size:14px\">\n          <span style=\"display:flex;justify-content:space-between;gap:12px\"><span>{{ s.label }}<\u002Fspan><strong style=\"font-variant-numeric:tabular-nums\">{{ s.show }}<\u002Fstrong><\u002Fspan>\n          <input type=\"range\" min=\"{{ s.min }}\" max=\"{{ s.max }}\" step=\"{{ s.step }}\" value=\"{{ s.value }}\" sc-camel-on-input=\"{{ s.set }}\" style=\"width:100%;accent-color:var(--color-accent)\">\n        <\u002Flabel>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n    <div style=\"padding:24px;display:flex;flex-direction:column;gap:14px;background:var(--color-surface)\">\n      <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:0;border-top:2px solid var(--color-text)\">\n        <sc-for list=\"{{ results }}\" as=\"r\" hint-placeholder-count=\"6\"><div style=\"padding:12px 12px 12px 0;border-bottom:2px solid var(--color-divider);display:flex;flex-direction:column;gap:2px\"><span style=\"font-size:12px;font-weight:700;color:var(--color-neutral-700)\">{{ r.k }}<\u002Fspan><span style=\"font-family:var(--font-heading);font-weight:800;font-size:26px;font-variant-numeric:tabular-nums\">{{ r.v }}<\u002Fspan><span style=\"font-size:12px;color:var(--color-neutral-700)\">{{ r.s }}<\u002Fspan><\u002Fdiv><\u002Fsc-for>\n      <\u002Fdiv>\n      <div style=\"padding:16px;background:var(--color-accent);color:#fff;display:flex;flex-direction:column;gap:4px\">\n        <span style=\"font-size:13px;font-weight:700;letter-spacing:0.06em;text-transform:uppercase\">Net monthly revenue change<\u002Fspan>\n        <span style=\"font-family:var(--font-heading);font-weight:800;font-size:48px;line-height:1;font-variant-numeric:tabular-nums\">{{ upliftLine }}<\u002Fspan>\n        <span style=\"font-size:14px\">{{ upliftSub }}<\u002Fspan>\n      <\u002Fdiv>\n      <button class=\"btn btn-secondary\" sc-camel-on-click=\"{{ resetModel }}\" style=\"align-self:flex-start\">Reset to defaults<\u002Fbutton>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section style=\"padding:40px 0;border-bottom:2px solid var(--color-text);display:flex;flex-direction:column;gap:24px\">\n  <div style=\"display:flex;gap:16px;align-items:baseline\"><span style=\"font-weight:800;color:var(--color-accent)\">07<\u002Fspan><h2 style=\"font-family:var(--font-heading);font-weight:800;font-size:32px;margin:0\">Site map<\u002Fh2><\u002Fdiv>\n  <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:24px\">\n    <sc-for list=\"{{ pages }}\" as=\"g\" hint-placeholder-count=\"3\">\n      <div style=\"display:flex;flex-direction:column;border-top:2px solid var(--color-text)\">\n        <span style=\"font-size:13px;font-weight:700;letter-spacing:0.06em;text-transform:uppercase;padding:12px 0\">{{ g.group }}<\u002Fspan>\n        <sc-for list=\"{{ g.items }}\" as=\"i\" hint-placeholder-count=\"6\"><div style=\"display:grid;grid-template-columns:minmax(120px,0.8fr) minmax(0,1.4fr);gap:12px;padding:9px 0;border-bottom:2px solid var(--color-surface);font-size:14px;line-height:1.4\"><strong>{{ i.k }}<\u002Fstrong><span style=\"color:var(--color-neutral-800)\">{{ i.v }}<\u002Fspan><\u002Fdiv><\u002Fsc-for>\n      <\u002Fdiv>\n    <\u002Fsc-for>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section style=\"padding:40px 0;border-bottom:2px solid var(--color-text);display:flex;flex-direction:column;gap:24px\">\n  <div style=\"display:flex;gap:16px;align-items:baseline\"><span style=\"font-weight:800;color:var(--color-accent)\">08<\u002Fspan><h2 style=\"font-family:var(--font-heading);font-weight:800;font-size:32px;margin:0\">Admin console<\u002Fh2><\u002Fdiv>\n  <p style=\"margin:0;max-width:780px;font-size:16px;line-height:1.5;text-wrap:pretty\">The “Admin” button in the header opens the Admin console: a full-length sidebar of 19 sections in four groups. Every mechanic has an on/off switch, an ⓘ explainer and a Configure panel, so routine changes need no code. Settings are saved in the browser for the demo (wire them to a database for production). The attention budget helps keep the site from feeling like a casino: each game costs points by how loud it is, and the meter warns when too many run at once.<\u002Fp>\n  <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));border:2px solid var(--color-text);background:#fff\">\n    <sc-for list=\"{{ admin }}\" as=\"a\" hint-placeholder-count=\"4\">\n      <div style=\"padding:22px;border-right:2px solid var(--color-divider);display:flex;flex-direction:column;gap:10px\">\n        <span style=\"font-size:12px;font-weight:700;letter-spacing:0.06em;text-transform:uppercase;color:var(--color-accent-700)\">Tab · {{ a.tab }}<\u002Fspan>\n        <strong style=\"font-size:18px\">{{ a.title }}<\u002Fstrong>\n        <sc-for list=\"{{ a.items }}\" as=\"x\" hint-placeholder-count=\"4\"><span style=\"font-size:14px;line-height:1.45;padding-top:8px;border-top:2px solid var(--color-surface)\">{{ x }}<\u002Fspan><\u002Fsc-for>\n      <\u002Fdiv>\n    <\u002Fsc-for>\n  <\u002Fdiv>\n<\u002Fsection>\n\n\n<section style=\"padding:32px 0 0\"><p style=\"margin:0;font-size:14px;line-height:1.5;color:var(--color-neutral-700);max-width:780px\">All figures in this document are sample data and planning estimates.<\u002Fp><\u002Fsection>\n\n<section style=\"padding:40px;background:var(--color-accent);color:#fff;display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:24px\">\n  <h2 style=\"font-family:var(--font-heading);font-weight:800;font-size:36px;line-height:1;margin:0\">Launch lean, then layer.<\u002Fh2>\n  <p style=\"margin:0;font-size:17px;line-height:1.5;align-self:end\">Start with the Lean preset (ladder, payment discounts, referrals, membership, Dutch drop, batch bounty, service badge, round-up). Add one live event per fortnight and keep the attention budget green.<\u002Fp>\n<\u002Fsection>\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\">\nclass Component extends DCLogic {\n  DEF = { orders: 1200, aov: 140, custs: 700, repeat: 1.6, aovLift: 30, repeatLift: 15, refRate: 8, discCost: 6 };\n  state = { lever: 'all', m: null };\n  renderVals() {\n    const s = this.state, m = s.m || this.DEF, set = (k) => e => this.setState({ m: { ...m, [k]: parseFloat(e.target.value) } });\n    const G = [\n      ['Pack ladder', 'Any mix of 3 / 5 / 10+ vials unlocks a rising % off the whole cart', 'Shop · Pack · Cart', 'On', 3, 0, 1, 0, 'Largest single AOV lever'],\n      ['Build a Pack', 'Cart = pack: rung markers, search, sort, \"In my pack\" filter, scales to a long catalogue', 'Pack', 'Core', 3, 0, 1, 0, 'Raises vials per order'],\n      ['Payment-method discounts', 'USDC/USDT 6%, bank 5%, Bitcoin 5%, Zelle 4%, shown as Save $X before choosing', 'Checkout', 'On', 0, 0, 1, 1, 'Cuts card fees and chargebacks'],\n      ['Crypto QR checkout', 'Coin + network picker, QR and address, 15-minute rate lock, saved wallet for one-tap repeat', 'Checkout', 'Core', 1, 0, 2, 2, 'Converts crypto-native buyers'],\n      ['Choose your reward', '% off now, or % credit for the next order', 'Checkout', 'On', 0, 0, 2, 0, 'Pulls the next order forward'],\n      ['Referral codes', 'Friend % off; referrer credit pending at once, released on delivery', 'Account · Checkout', 'On', 0, 3, 0, 0, 'Low-cost acquisition'],\n      ['Pack split', 'Two people share a 10-pack at the 10+ price', 'Pack · Product', 'On', 2, 3, 0, 0, 'AOV + paired acquisition'],\n      ['Lists', 'Curated stacks; curator earns credit; moderated; any past order can be published', 'Lists · Account', 'On', 2, 3, 1, 1, 'Creator-led traffic'],\n      ['Membership tiers + ABC+', 'Member / Principal / Director by season spend; optional paid ABC+', 'Sitewide', 'On', 1, 0, 3, 0, 'Retention + subscription revenue'],\n      ['Dutch drop (falling)', 'Price falls on a clock; if it clears lower you get the difference back', 'Drops', 'On', 1, 2, 3, 0, 'Event traffic spikes'],\n      ['Reverse Dutch (rising)', 'Restock opens low and steps up as it sells', 'Drops', 'On', 1, 1, 3, 0, 'Fast sell-through'],\n      ['Flash lot', 'A new small tested lot every 20 minutes on drop day', 'Drops · Home', 'On', 1, 1, 3, 0, 'Time on site, repeat checks'],\n      ['ABC Live schedule', 'Fixed weekly slots with a LIVE marker and reminders', 'Drops', 'On', 0, 2, 3, 0, 'Weekly visiting habit'],\n      ['Allocation release', 'RSVPs grow the units released; invites move you up', 'Drops', 'On', 0, 3, 2, 0, 'Pre-launch virality'],\n      ['Name your price (bulk)', 'Offers on 20-packs of slow lots, time-boxed, hidden floor', 'Product', 'On', 3, 0, 1, 0, 'Clears slow stock in bulk'],\n      ['Seasonal sale', 'Named event adds a bonus % to every ladder rung, with a typed banner', 'Sitewide', 'On', 2, 0, 1, 0, 'Clear sale signalling'],\n      ['Product discounts', 'Type a % off any product; SALE flag and was-price appear at once', 'Shop · Admin', 'Core', 2, 0, 1, 0, 'Simple markdowns, no code'],\n      ['Group goal', 'Community meter unlocks a perk for everyone', 'Home', 'On', 1, 2, 1, 0, 'Collective urgency'],\n      ['Order streak', 'Consecutive months raise the credit rate', 'Account', 'On', 0, 0, 3, 0, 'Monthly repeat rate'],\n      ['Auto-pack', 'Repeat any pack every N days (custom), price locked, skip or cancel any time', 'Pack · Account', 'On', 1, 0, 3, 0, 'Predictable recurring revenue'],\n      ['Call the Lab', 'Free purity prediction contest before each COA posts', 'Lab · Home', 'On', 0, 2, 2, 3, 'Turns testing into an event'],\n      ['Round-up', 'Round up to the next dollar for a named charity, matched', 'Checkout', 'On', 0, 1, 0, 2, 'Goodwill'],\n      ['Service badge', 'Verified service and lab staff get a standing %', 'Profile · Checkout', 'On', 0, 1, 1, 2, 'Loyal niche segment'],\n      ['Batch bounty', 'Pay customers to test their own lot independently', 'Lab · Product', 'Off', 0, 1, 0, 3, 'Independent proof'],\n      ['Restock vote', 'One vote per order; voters get first access', 'Drops', 'Off', 0, 1, 2, 0, 'Demand data for buying'],\n      ['Pool presale', 'Price falls for all as commitments rise', 'Drops', 'Off', 2, 3, 1, 0, 'Pre-funded inventory'],\n      ['Credit vault', 'Unspent credit grows if kept 60 days', 'Account', 'Off', 2, 0, 1, 0, 'Saves up for bigger orders'],\n      ['COA 101', 'Short lesson on reading a COA, one-time credit', 'Lab', 'Off', 0, 0, 0, 3, 'Educated, loyal buyers'],\n      ['Spot the fail', 'Find the problem in a sample COA', 'Lab', 'Off', 0, 0, 1, 3, 'Shows why testing matters'],\n      ['Founder’s desk', 'Monthly note plus a members’ vote', 'Home', 'Off', 0, 0, 1, 2, 'Brand loyalty']\n    ];\n    const score = g => g[4] + g[5] + g[6] + g[7];\n    G.sort((a, b) => score(b) - score(a));\n    const dots = n => n ? '●'.repeat(n) : '—';\n    const key = { aov: 4, vir: 5, ret: 6, tru: 7 }[s.lever];\n    const X = {\n      'Pack ladder': ['Every vial in the cart counts toward one ladder: 3+, 5+ and 10+ each unlock a bigger % off the whole cart, in any mix.', '2 vials at list → add a third and all three drop a rung.', 'The next rung is always shown at the moment of adding.', 'A stacking cap stops ladder + other discounts eroding margin.'],\n      'Build a Pack': ['The cart is the pack. Rung markers, search, sort (popular, A–Z, price) and an \"In my pack\" filter; the list collapses to the top items with \"Show all\".', 'A 60-product catalogue stays scannable on a phone.', 'Seeing the next rung beside the list prompts one more vial.', 'Out-of-stock items are flagged, never silently dropped.'],\n      'Payment-method discounts': ['Each method has its own %, shown as \"Save $X\" beside it before the buyer chooses.', 'A $300 order shows \"Save $18.00\" next to USDC.', 'Moves volume to cheaper rails and away from chargebacks.', 'Keep each % below the fee it saves. Rails pending counsel.'],\n      'Crypto QR checkout': ['Pick coin and network, scan the QR or copy the address, and the rate is locked for 15 minutes. Returning buyers pay from a saved wallet in one tap.', 'Pay $128.00 now with your saved USDC wallet → approve → done.', 'Removes the copy-paste fear that kills crypto conversions.', 'Orders ship only after on-chain confirmation; expired locks re-quote.'],\n      'Choose your reward': ['At checkout the buyer picks % off now, or % credit for their next order.', 'Mark picks 10% credit and gets $14 toward next month.', 'Credit-later pulls the second order forward.', 'Exactly one reward per order.'],\n      'Referral codes': ['Every customer has a code and link. Friends get % off a first order; the referrer’s credit shows as pending at once and releases on delivery.', 'Alex uses ALEX-10, saves 10%; Mark sees +$10 pending.', 'Instant feedback makes sharing feel rewarding.', 'Own codes rejected; credit only after delivery.'],\n      'Pack split': ['Fill 5 slots and send a split link; when a friend fills the other 5, both pay the 10+ price and ship separately.', 'Both buy 5 vials at the 10+ rate.', 'Turns one buyer into two at the top rung.', 'Links expire after 48 hours.'],\n      'Lists': ['Researchers publish named stacks; buyers add the whole list at pack pricing and the curator earns credit. Any past order can be published as a list from Account → Orders.', 'A creator posts one link that sells a full stack.', 'Creator-led traffic with social proof.', 'Fixed-vocabulary names, admin approval, auto-pulled if a lot fails.'],\n      'Membership tiers + ABC+': ['Season spend sets the tier, with rising credit back and early drop access. ABC+ is an optional paid tier.', 'Mark is $897 from Director this season.', 'Status and early access keep spend here.', 'Tiers re-rank each season so new buyers can climb.'],\n      'Dutch drop (falling)': ['A pack’s price falls on a public clock until it sells out. Lock in any time; if it clears lower, the difference comes back as credit.', 'Lock at $164, clears at $139 → $25 credit.', 'Urgency without punishing early buyers.', 'Floor price and per-person limit should be enforced on the server.'],\n      'Reverse Dutch (rising)': ['A restock opens at its lowest price and steps up as units sell.', 'First units at $19, next at $23.', 'Being early is the discount.', 'Steps published in advance.'],\n      'Flash lot': ['On drop day, a different small tested lot goes up every 20 minutes at a set % off.', 'GHK-Cu −40%, 22 of 40 left, next lot in 11:41.', 'Keeps people on site and checking back.', 'Real overstock only.'],\n      'ABC Live schedule': ['Drops run in fixed weekly slots shown as a calendar, with LIVE markers and reminders.', 'Tue Dutch, Thu rising restock, Sat allocation release.', 'A predictable schedule builds a weekly habit.', 'Keep slots fixed; moving them breaks the habit.'],\n      'Allocation release': ['Before a restock opens, RSVPs grow the units released; each friend who RSVPs via your link moves you up.', '500 RSVPs unlock extra units for everyone.', 'Buyers recruit before the drop.', 'Unlock tiers fixed before RSVPs open.'],\n      'Name your price (bulk)': ['On flagged slow lots, buyers offer a price on a 20-pack in a time-boxed window. Above a hidden floor it’s accepted; below, a one-time counter-offer.', 'An offer of $350 gets a $361 counter, accepted.', 'Clears slow stock without public markdowns.', 'One offer per lot per window; floor never shown.'],\n      'Seasonal sale': ['A named sale adds a bonus % to every ladder rung, with a typed, colour-coded banner and countdown.', 'Lot Clearout: +10% on every rung until the countdown ends.', 'Spikes traffic and reactivates lapsed buyers.', 'Run rarely or buyers learn to wait.'],\n      'Product discounts': ['In admin, type a % off any product or tap 10% / 20%. A red SALE flag and the was-price appear in the shop straight away.', 'BPC-157 at 20% off for the weekend.', 'Simple markdowns without a developer.', 'Sale prices still sit under the stacking cap.'],\n      'Group goal': ['One public meter for the community; when it fills, everyone gets a perk.', '10,000 vials in a month → free-shipping weekend.', 'Gives buyers a reason to nudge others.', 'Set goals you hit about 70% of the time.'],\n      'Order streak': ['Ordering in consecutive months adds credit-back, up to a cap.', 'Third month in a row → +2% back.', 'Missing a month costs something.', 'A missed month pauses, not resets.'],\n      'Auto-pack': ['Save any pack to repeat every N days (fully custom), with the price locked. Reminder before each run; skip, pause or cancel in one tap.', 'BPC ×3 and Semax ×2 every 45 days.', 'Predictable revenue and demand forecasts.', 'Out-of-stock items skipped, never substituted.'],\n      'Call the Lab': ['Before a COA posts, anyone guesses the purity; the closest three win credit.', 'Guess 99.38%, actual 99.41% → +$10.', 'Makes testing an event people return for.', 'Free entry, skill-based, official rules page.'],\n      'Round-up': ['Round the order up to the next dollar for a named charity, matched.', '$4,212 raised toward $5,000.', 'Goodwill and PR.', 'Publish totals donated.'],\n      'Service badge': ['Verified service members and lab staff get a profile badge and a standing %.', '5% off every order after one-time verification.', 'Loyal, word-of-mouth segment.', 'Verify through a third party; store no documents.'],\n      'Batch bounty': ['Buyers send a sealed vial to an accredited lab; in spec earns credit, out of spec pulls the lot and refunds.', '$25 credit per accepted report.', 'Independent proof is a strong trust signal.', 'Publish every result, pass or fail.'],\n      'Restock vote': ['Each order earns a vote on what comes back next; voters get first access.', 'Pinealon wins → voters get in early.', 'Free demand data for buying.', 'Honour the result.'],\n      'Pool presale': ['Price tiers fall as commitments rise; everyone pays the price reached at close.', '250 committed → lower price for all.', 'Pre-sells inventory.', 'Refund automatically if it doesn’t fill.'],\n      'Credit vault': ['Credit left unspent for 60 days grows by a set %.', '$8.53 → $9.38.', 'Encourages one bigger order.', 'Cap the growth.'],\n      'COA 101': ['A short lesson on reading a COA with a one-time credit for finishing.', 'What 10.47 mg on a 10 mg label means.', 'Educated buyers value testing.', 'One payout per account.'],\n      'Spot the fail': ['Find the problem in a sample COA for a small credit.', 'A 78% fill fails even at 99.6% purity.', 'Shows why fill testing matters.', 'Clearly labelled sample COAs.'],\n      'Founder’s desk': ['A monthly note plus a members’ vote on one decision.', 'Vote: which test panel to add next.', 'A person behind the brand.', 'Votes are advisory; publish results.']\n    };\n    const rows = G.filter(g => s.lever === 'all' || g[key] >= 2).map(g => ({ ...(() => { const x = X[g[0]] || ['', '', '', '']; return { how: x[0], ex: x[1], why: x[2], guard: x[3] }; })(), isHover: s.hover === g[0], rowBg: s.hover === g[0] ? 'var(--color-surface)' : 'transparent', enter: (ev) => { const W = window.innerWidth, H = window.innerHeight, cx = ev.clientX, cy = ev.clientY; const x = Math.max(16, Math.min(cx + 18, W - 436)), y = cy > H - 300 ? Math.max(16, cy - 290) : cy + 18; this.setState({ hover: g[0], hx: x, hy: y }); }, leave: () => this.setState({ hover: null }), name: g[0], desc: g[1], where: g[2], def: g[3], defCls: g[3] === 'On' ? 'tag-accent' : g[3] === 'Core' ? 'tag-outline' : 'tag-neutral', aov: dots(g[4]), vir: dots(g[5]), ret: dots(g[6]), tru: dots(g[7]), rev: g[8] }));\n    const baseRev = m.orders * m.aov;\n    const newAov = m.aov * (1 + m.aovLift / 100);\n    const newOrders = m.orders * (1 + m.repeatLift / 100) + (m.custs * m.refRate / 100) * m.repeat;\n    const gross = newOrders * newAov, disc = gross * m.discCost / 100, net = gross - disc, up = net - baseRev;\n    const f = x => '$' + Math.round(x).toLocaleString();\n        return {\n      files: [['Company ABC Site.dc.html', 'Live site']].map(([href, label]) => ({ href, label })),\n      headline: [{ v: String(G.filter(g => g[3] !== 'Core').length), k: 'Mechanics with an admin switch', s: 'Each with an ⓘ explainer and a Configure panel, plus 3 core features' }, { v: String(G.filter(g => g[3] === 'On').length), k: 'On by default', s: 'The Favorites preset' }, { v: '10%', k: 'Control group per mechanic', s: 'Lift measured, not guessed' }, { v: '19', k: 'Admin sections', s: 'Store, Growth, Operations, System' }],\n      advantages: [\n        { n: '01', t: 'Trust you can check, and a reason to stay', b: 'A lot-number lookup and the latest lab results sit in the hero, with a direct \"See all 196 lab results\" button. Every lot’s purity and per-vial fill are on its product page, searchable by the lot number on the label. Trust also creates switching costs: once a buyer has vetted us (checked COAs, tested a first order, seen lots stay consistent), moving to another supplier means doing that all again, so trusted customers tend to stay.', p: 'Lever: first-order conversion, then retention.' },\n        { n: '02', t: 'Repeat orders in three taps', b: 'Returning buyers reorder and pay from a saved USDC wallet without re-entering anything. Auto-pack repeats any pack every N days at a locked price.', p: 'Lever: orders per customer, the core of this business.' },\n        { n: '03', t: 'Crypto-native checkout', b: 'One “Pay with” choice with a fixed network per coin, a QR code or open-in-wallet button, a 15-minute rate lock and a confirmation step. Stablecoins get the biggest discount, shown as \"Save $X\" before the buyer chooses.', p: 'Lever: aims to cut abandoned crypto payments and card fees.' },\n        { n: '04', t: 'Every incentive is measured', b: 'Each mechanic can run with its own control group. Experiments & holdouts shows lift, significance and a suggested Keep or Switch-off verdict, so discounts that don’t pay can be turned off. The demo shows sample data.', p: 'Lever: margin. Less spent on incentives that don’t work.' },\n        { n: '05', t: 'Day-to-day changes without code', b: 'Switching mechanics on or off, changing their numbers and marking products on sale are done from admin. New mechanics, integrations and rule changes still need a developer, but routine promotions don’t.', p: 'Lever: speed. Routine promotions go live the same day.' },\n        { n: '06', t: 'Mechanics that explain themselves', b: 'Shoppers get a \"How each drop works\" panel with three plain steps per drop. Staff get an ⓘ on every mechanic: how it works, what it moves and what to watch out for.', p: 'Lever: participation in drops; should reduce support questions.' },\n        { n: '07', t: 'Bigger orders by design', b: 'One pack ladder everywhere, always showing the next rung. Build a Pack handles a long catalogue with search, sort and filters, and lists turn a past order into a shareable stack.', p: 'Lever: average order value.' },\n        { n: '08', t: 'Clean, research-only positioning', b: 'One US store, research use only, with a single attestation on file. No prescription route and no supplement or FDA wording. An attention budget helps keep the site from feeling like a casino.', p: 'Lever: lower processor and compliance risk.' }\n      ],\n      design: [\n        { area: 'Theme', what: 'Navy, teal and orange with the Company ABC wordmark', why: 'Teal always means tested or trusted; orange is reserved for drops and sales; navy carries actions. Rounded cards and Familjen Grotesk keep it calm and credible.' },\n        { area: 'Positioning', what: 'Proof-first home page', why: '\"Every batch tested. Every result public.\" with a lot lookup, the latest four lab results beside it and a direct button to all 196 results.' },\n        { area: 'Home', what: 'Proof hero plus \"Happening now\"', why: 'Every live drop shows as a tile (4 to 8); if fewer than 4 are live, everyday tiles fill in: latest lab result, pack ladder, most ordered, invite. The group goal meter sits below. Streak and membership moved to the account dashboard.' },\n        { area: 'Store', what: 'One US store, research use only', why: 'The prescription route and the separate international store were removed, so the same claims apply to every product.' },\n        { area: 'Build a Pack', what: 'Built for a long catalogue', why: 'Search, sort by popularity, A–Z or price, an \"In my pack\" filter and \"Show all\", with rung markers always in view. The noisy \"usuals\" block is gone.' },\n        { area: 'Checkout', what: 'One screen, crypto-first', why: 'Saved details and attestation, payment savings beside each method, every discount listed, QR crypto payment with a rate lock, and single-approval pay for returning buyers.' },\n        { area: 'Drops', what: 'ABC Live schedule, how-to panel and ⓘ tooltips', why: 'A fixed weekly calendar with LIVE markers; a collapsed \"New to drops?\" panel with three steps per drop; and an ⓘ on every drop card that explains it on hover or tap.' },\n        { area: 'Account', what: 'Status at a glance, orders you can reuse', why: 'Order streak and membership progress at the top of the dashboard. Reorder any past order, publish it as a list, and run auto-packs on a custom number of days.' },\n        { area: 'Admin', what: 'Full-width console, one home per setting', why: 'Product discounts, Promotion results, Games & incentives (Configure panels, yellow ⓘ notes, attention budget explainer, promo banner editor with live preview) and Experiments & holdouts. Pricing & rules keeps only store-wide settings; the date range only shows on time-based pages.' }\n      ],\n      pages: [\n        { group: 'Public', items: [['Home', 'Proof hero, lot lookup, latest results, Happening now (4–8 tiles), group goal'], ['Shop', 'Filters, SALE flags, was-prices'], ['Product', 'Lot panel, ladder tiers, split, name your price'], ['Build a Pack', 'Search, sort, filters, rung markers, auto-pack'], ['Drops', 'ABC Live schedule, how-to panel, ⓘ tooltips, Dutch, rising, flash, allocation, pool, vote'], ['Lists', 'Browse, open, add whole list, share'], ['The Lab', 'Results ledger + COA viewer, Call the Lab, bounty'], ['Members', 'Tiers + ABC+']].map(([k, v]) => ({ k, v })) },\n        { group: 'Signed in', items: [['Dashboard', 'Streak and membership status, credit, orders, in transit'], ['Orders', 'Reorder, buy again, publish as list'], ['Rewards', 'Credit, streak, badges, history'], ['Invite', 'Code, link, pending credit'], ['Auto-packs', 'Custom frequency in days, skip, edit, pause, cancel'], ['My lists', 'Status, shares, earnings'], ['Profile', 'Details, addresses, attestation, service badge']].map(([k, v]) => ({ k, v })) },\n        { group: 'Checkout & admin', items: [['Checkout', 'Reward choice, codes, credit, payment savings, round-up'], ['Crypto payment', 'Coin + network, QR, 15-min rate lock, confirmation'], ['Confirmation', 'Credit earned, streak, share'], ['Admin · Store', 'Dashboard, orders, products & inventory, customers'], ['Admin · Growth', 'Analytics, promotion results, product discounts, games & incentives, experiments, referrals, lists'], ['Admin · Operations', 'Testing & COAs, shipping, payments & payouts, support'], ['Admin · System', 'Pricing & rules
