--color-text)', pick: () => this.setState({ lever: id }) })),\n      gameRows: rows, hasHover: !!s.hover && rows.some(r => r.name === s.hover), hv: (() => { const r = rows.find(r => r.name === s.hover) || {}; return { name: r.name || '', how: r.how || '', ex: r.ex || '', why: r.why || '', guard: r.guard || '', x: s.hx || 0, y: s.hy || 0 }; })(),\n      levers: [\n        { name: 'Order size', how: 'Make the next vial visibly cheaper and the next rung always in view; give bulk buyers a direct line via offers.', games: 'Pack ladder, Build a Pack, Pack split, Lists, Name your price, Seasonal sale, Auto-pack', kpi: 'Vials per order, AOV, % of orders at 5+ and 10+', range: '+20–40% AOV' },\n        { name: 'Virality', how: 'Give people a reason to share at the moment they want something: a cheaper split, a bigger allocation, a curator cut.', games: 'Referral codes, Pack split, Allocation release, Lists, Group goal', kpi: 'Referral share of new customers, invites per buyer', range: '5–15% of buyers refer ≥1' },\n        { name: 'Return visits', how: 'A fixed weekly schedule, one-tap reorders and small recurring reasons to check in.', games: 'ABC Live, Dutch, rising, flash lot, Call the Lab, Order streak, Membership, Auto-pack, saved-wallet pay', kpi: 'Weekly active buyers, orders per customer, 60-day repeat rate', range: '+10–25% orders per customer' },\n        { name: 'Trust', how: 'Make testing something customers can see, check and take part in. In this sector, trust is a major driver of conversion.', games: 'Lot lookup, results ledger + COA viewer, Call the Lab, Batch bounty, Spot the fail', kpi: 'Product-page conversion, COA opens per session, refund rate', range: '+5–15% conversion' }\n      ],\n      sliders: [\n        ['orders', 'Orders per month today', 100, 10000, 50, x => x.toLocaleString()],\n        ['aov', 'Average order today', 40, 600, 5, x => '$' + x],\n        ['custs', 'Active customers per month', 50, 8000, 50, x => x.toLocaleString()],\n        ['repeat', 'Orders per referred customer (first 90 days)', 1, 4, 0.1, x => x.toFixed(1)],\n        ['aovLift', 'AOV lift from ladder & packs', 0, 60, 1, x => '+' + x + '%'],\n        ['repeatLift', 'Extra orders from drops, streaks, tiers & one-tap reorder', 0, 50, 1, x => '+' + x + '%'],\n        ['refRate', 'Customers who bring a new buyer / mo', 0, 30, 1, x => x + '%'],\n        ['discCost', 'Extra discount cost (% of gross)', 0, 20, 0.5, x => x + '%']\n      ].map(([k, label, min, max, step, fmt]) => ({ label, min, max, step, value: m[k], show: fmt(m[k]), set: set(k) })),\n      results: [\n        { k: 'Revenue today', v: f(baseRev), s: m.orders.toLocaleString() + ' orders × $' + m.aov },\n        { k: 'New AOV', v: f(newAov), s: '+' + m.aovLift + '%' },\n        { k: 'Orders after', v: Math.round(newOrders).toLocaleString(), s: '+' + Math.round(newOrders - m.orders).toLocaleString() + ' per month' },\n        { k: 'Gross after', v: f(gross), s: 'before extra discounts' },\n        { k: 'Extra discount cost', v: '−' + f(disc), s: m.discCost + '% of gross' },\n        { k: 'Net after', v: f(net), s: 'per month' }\n      ],\n      upliftLine: (up >= 0 ? '+' : '−') + f(Math.abs(up)), upliftSub: (up / baseRev * 100).toFixed(0) + '% vs today · ' + (up >= 0 ? '+' : '−') + f(Math.abs(up * 12)) + ' a year',\n      resetModel: () => this.setState({ m: null }),\n      clicks: [{ k: 'Checkout steps', before: '5', after: '1', note: 'One review screen with details on file' }, { k: 'Taps to reorder and pay', before: '~20 (est.)', after: '3', note: 'Reorder → pay with saved wallet → approve' }, { k: 'Compliance ticks per order', before: '3 + dropdown', after: '1', note: 'Attestation on file, one reconfirm tick' }, { k: 'Taps with an auto-pack', before: '—', after: '0', note: 'Reminder first, then ships automatically' }],\n      friction: [\n        { step: 'Start a pack', before: 'Pick a pack tier first, then fill it', after: 'Add vials anywhere; the cart is the pack and the ladder climbs on its own' },\n        { step: 'Find a product', before: 'Scroll a long unsorted grid', after: 'Search, sort and \"In my pack\" filter on Build a Pack; top items first with \"Show all\"' },\n        { step: 'Reorder', before: 'Find each product again', after: '\"Reorder\" on any past order goes straight to checkout' },\n        { step: 'Trust check', before: 'Separate results page, search, open a PDF', after: 'Lot lookup in the hero; purity and fill on the product page; any ledger row opens the COA in place' },\n        { step: 'Crypto payment', before: 'Copy an address, guess the network, hope the rate holds', after: 'One “Pay with” choice, QR or open-in-wallet, 15-minute rate lock; returning buyers pay from a saved wallet' },\n        { step: 'Compliance', before: 'Checkboxes and a purpose dropdown on every order', after: 'Signed once; one reconfirm tick at checkout' },\n        { step: 'Discounts', before: 'Coupon hunt; payment discount revealed late', after: 'Every saving listed in order; \"Save $X\" beside each payment method before choosing' },\n        { step: 'Understanding drops', before: 'No explanation of how each drop works', after: 'A how-to panel on Drops with three plain steps per drop type, plus an ⓘ tooltip on every drop card' },\n        { step: 'Repeat monthly', before: 'Start from scratch', after: 'Auto-pack on any custom number of days, price locked, skip or cancel any time' }\n      ],\n      todo: [['Data', 'Replace sample purity, lot, order and KPI figures with real data'], ['Payments', 'Counsel sign-off on crypto, bank and Zelle; connect a crypto processor and wallet confirmations'], ['Configure', 'Enforce per-mechanic product, audience, date, limit and stacking settings at checkout'], ['Mobile', 'Full pass on the phone layout'], ['Banner dates', 'Make the promo banner end date the only date for the seasonal sale'], ['Backend', 'Persist admin settings, orders, credit, lists and experiment data'], ['Legal', 'Official rules page for
