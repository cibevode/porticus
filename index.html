<!DOCTYPE html>
<html lang="en"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow"><meta name="color-scheme" content="dark">
<title>Porticus</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--gold:#C8A951;--gold-l:#E2C97A;--slate:#1A1A2E;--bg:#0E0E16;--muted:#8A8A98;}
*{margin:0;padding:0;box-sizing:border-box;}
body{background:radial-gradient(circle at 50% 30%, #1a1a2e 0%, #0E0E16 70%);font-family:'Inter',sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;}
.gate{background:var(--slate);border-top:3px solid var(--gold);border-radius:8px;padding:46px 42px 38px;width:100%;max-width:410px;text-align:center;box-shadow:0 24px 70px rgba(0,0,0,.55);position:relative;}
.cb{position:absolute;width:22px;height:22px;border-color:var(--gold);opacity:.5;}
.cb.tl{top:12px;left:12px;border-top:2px solid;border-left:2px solid;}
.cb.tr{top:12px;right:12px;border-top:2px solid;border-right:2px solid;}
.lock{font-size:26px;margin-bottom:14px;}
.brand{font-family:'Cinzel',serif;font-weight:700;font-size:30px;letter-spacing:4px;color:var(--gold);}
.sub{font-size:12.5px;color:var(--muted);letter-spacing:.6px;margin-top:14px;margin-bottom:28px;line-height:1.5;}
input{width:100%;padding:14px 16px;background:rgba(255,255,255,.05);border:1px solid rgba(200,169,81,.3);border-radius:6px;color:#F5F0E8;font-size:15px;font-family:'Inter';text-align:center;letter-spacing:1px;outline:none;transition:border-color .15s;}
input:focus{border-color:var(--gold);}
input::placeholder{color:rgba(245,240,232,.35);letter-spacing:.5px;}
button{width:100%;margin-top:13px;padding:13px;background:linear-gradient(90deg,var(--gold-l),var(--gold));border:none;border-radius:6px;color:var(--slate);font-size:13px;font-weight:700;letter-spacing:2px;text-transform:uppercase;cursor:pointer;transition:opacity .15s;}
button:hover{opacity:.92;}
.err{color:#E08B8B;font-size:12.5px;margin-top:16px;min-height:16px;visibility:hidden;}
.err.show{visibility:visible;}
</style></head>
<body>
<div class="gate">
  <span class="cb tl"></span><span class="cb tr"></span>
  <div class="lock">&#128274;</div>
  <div class="brand">Porticus</div>
  <div class="sub">Enter the password to continue.</div>
  <input id="pw" type="password" placeholder="Password" autocomplete="off" autofocus>
  <button id="go">Enter</button>
  <div class="err" id="err">Incorrect password &mdash; try again.</div>
</div>

function b64(b){const s=atob(b),a=new Uint8Array(s.length);for(let i=0;i<s.length;i++)a[i]=s.charCodeAt(i);return a;}
async function unlock(pw){
  const km=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),{name:'PBKDF2'},false,['deriveKey']);
  const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:b64(ENC.salt),iterations:ENC.iter,hash:'SHA-256'},km,{name:'AES-GCM',length:256},false,['decrypt']);
  const buf=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64(ENC.iv)},key,b64(ENC.ct));
  return new TextDecoder().decode(buf);
}
async function attempt(){
  const pwEl=document.getElementById('pw'),err=document.getElementById('err');
  try{const html=await unlock(pwEl.value);document.open();document.write(html);document.close();}
  catch(e){err.classList.add('show');pwEl.value='';pwEl.focus();}
}
document.getElementById('go').addEventListener('click',attempt);
document.getElementById('pw').addEventListener('keydown',e=>{if(e.key==='Enter')attempt();});
